<!DOCTYPE html>
<html>
<head>
    <title>Mapa Interactivo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([28.632996, -106.069099], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var currentMarker = null; // Variable para guardar el marcador actual

        // --- FUNCIÓN PARA ENVIAR COORDENADAS A C# ---
        function enviarCoordenadasACSharp(lat, lng) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ type: 'mapClick', latitude: lat, longitude: lng });
            } else {
                console.error("WebView2 host object not available.");
            }
        }

        // --- DETECTAR CLICS EN EL MAPA ---
        map.on('click', function (e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            ponerMarcador(lat, lng);
            enviarCoordenadasACSharp(lat, lng);
        });

        // --- FUNCIÓN PARA PONER/MOVER MARCADOR ---
        function ponerMarcador(lat, lng) {
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map);
        }

        // --- FUNCIÓN PARA CENTRAR MAPA (Llamada desde C#) ---
        function centrarMapa(lat, lng, zoomLevel) {
            map.setView([lat, lng], zoomLevel || 17); // Usa zoom 17 por defecto
            ponerMarcador(lat, lng); // Pone un marcador también
        }

        // --- ¡EL "OÍDO" QUE FALTABA! ---
        // Escucha los mensajes que vienen desde C#
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const message = event.data; // Recibe el objeto JSON

                // Si el mensaje es de tipo 'setMapCenter'...
                if (message.type === 'setMapCenter') {
                    // ...llama a la función para mover el mapa
                    centrarMapa(message.latitude, message.longitude, 17);
                }
            });
        }
    </script>
</body>
</html>
